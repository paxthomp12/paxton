<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oura Authentication - Paxton Thompson</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #0a0f0a 0%, #0d1a12 50%, #0a0f0a 100%);
            background-attachment: fixed;
            color: #f5f3ef;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            text-align: center;
            max-width: 500px;
            background: #0f140f;
            padding: 3rem;
            border-radius: 12px;
            border: 1px solid rgba(201, 169, 98, 0.2);
        }

        h1 {
            color: #c9a962;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .status {
            margin: 2rem 0;
            font-size: 1.1rem;
        }

        .spinner {
            border: 3px solid rgba(201, 169, 98, 0.2);
            border-top: 3px solid #c9a962;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success {
            color: #126b4a;
        }

        .error {
            color: #d9534f;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #c9a962;
            color: #0a0f0a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            margin-top: 1rem;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #d4b978;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Oura Authentication</h1>
        <div class="spinner" id="spinner"></div>
        <div class="status" id="status">Processing authentication...</div>
        <div id="actionContainer"></div>
    </div>

    <script>
        const CLIENT_ID = 'e02ab922-92a9-4a4d-ab84-83abea0604e0';
        const CLIENT_SECRET = 'vldzQMMIYK-CZQ9wJLukulIGOHGp8qPMHVUPMQzQ';

        // Auto-detect environment
        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const REDIRECT_URI = isLocalhost
            ? 'http://localhost:8080/auth/oura/callback.html'
            : 'https://paxton-thompson.com/auth/oura/callback';

        async function handleCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const error = urlParams.get('error');

            if (error) {
                showError(`Authentication failed: ${error}`);
                return;
            }

            if (!code) {
                showError('No authorization code received');
                return;
            }

            try {
                // Exchange authorization code for access token
                const tokenResponse = await fetch('https://api.ouraring.com/oauth/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        grant_type: 'authorization_code',
                        code: code,
                        redirect_uri: REDIRECT_URI,
                        client_id: CLIENT_ID,
                        client_secret: CLIENT_SECRET
                    })
                });

                if (!tokenResponse.ok) {
                    const errorData = await tokenResponse.json();
                    throw new Error(errorData.error_description || 'Failed to get access token');
                }

                const tokenData = await tokenResponse.json();

                // Store tokens
                localStorage.setItem('ouraAccessToken', tokenData.access_token);
                localStorage.setItem('ouraRefreshToken', tokenData.refresh_token);
                localStorage.setItem('ouraTokenExpiry', Date.now() + (tokenData.expires_in * 1000));

                // Fetch user info to verify
                const userResponse = await fetch('https://api.ouraring.com/v2/usercollection/personal_info', {
                    headers: {
                        'Authorization': `Bearer ${tokenData.access_token}`
                    }
                });

                if (!userResponse.ok) {
                    throw new Error('Failed to fetch user info');
                }

                const userData = await userResponse.json();

                showSuccess(`Successfully connected to Oura Ring!`);

            } catch (error) {
                showError(`Error: ${error.message}`);
            }
        }

        function showSuccess(message) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status').className = 'status success';
            document.getElementById('status').textContent = message;

            const trackerUrl = isLocalhost
                ? 'http://localhost:8080/throwing-tracker.html'
                : '/throwing-tracker.html';

            // Auto-redirect after 2 seconds
            setTimeout(() => {
                window.location.href = trackerUrl;
            }, 2000);

            document.getElementById('actionContainer').innerHTML = `
                <p style="color: var(--text-muted); margin-top: 1rem;">Redirecting to tracker...</p>
                <a href="${trackerUrl}" class="btn">Return Now</a>
            `;
        }

        function showError(message) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status').className = 'status error';
            document.getElementById('status').textContent = message;

            const trackerUrl = isLocalhost
                ? 'http://localhost:8080/throwing-tracker.html'
                : '/throwing-tracker.html';

            document.getElementById('actionContainer').innerHTML = `
                <a href="${trackerUrl}" class="btn">Return to Tracker</a>
            `;
        }

        // Run when page loads
        handleCallback();
    </script>
</body>
</html>
